<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New registration pending approval</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#333333;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:20px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #dddddd;">
<tr><td style="padding:20px 30px;border-bottom:1px solid #dddddd;"><strong style="font-size:18px;">{shop_name}</strong></td></tr>
<tr><td style="padding:30px;font-size:14px;line-height:22px;">
<h2 style="margin:0 0 15px 0;font-size:18px;">New registration pending approval</h2>
<p>A new customer has registered and is awaiting approval:</p>
<ul>
<li><strong>Name:</strong> {firstname} {lastname}</li>
<li><strong>Email:</strong> {email}</li>
<li><strong>Company:</strong> {company}</li>
</ul>
<p>Review it in <strong>Customers &rarr; Aprobación B2B</strong>.</p>
</td></tr>
<tr><td style="padding:15px 30px;border-top:1px solid #dddddd;font-size:12px;color:#888888;">{shop_name} - <a href="{shop_url}" style="color:#888888;">{shop_url}</a></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
